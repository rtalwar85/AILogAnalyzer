name: ailoganalyzer

services:
  ailoganalyzer-java:
    build:
      context: ./AILogAnalyzerJava
      dockerfile: Dockerfile
    container_name: ailoganalyzer-java
    ports:
      - "8080:8080"
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      # Allow any path that is visible inside the container (security tradeoff)
      LOG_ALLOWED_ROOTS: /logs,/mnt
      LOG_ALLOW_ANY_PATH: "true"
      # Optional path aliases so UI can keep using Windows/UNC paths while container reads mounted paths
      LOG_PATH_ALIAS_MAP: "//jgtstaurwcs/IBM/WebSphere/AppServer/profiles/tstaurora/logs/server1=>/mnt/jgtstaurwcs-server1"
      LOG_ANALYZER_CONFIG_FILE: /data/.log-analyzer.config.json
      LOG_ENABLE_CLOUD_PATHS: ${LOG_ENABLE_CLOUD_PATHS:-true}
      LOG_CLOUD_PROVIDERS: ${LOG_CLOUD_PROVIDERS:-aws,gcp,azure}
      LOG_AWS_REGION: ${LOG_AWS_REGION:-us-east-1}
      LOG_MAX_FILES: ${LOG_MAX_FILES:-30}
      LOG_MAX_BYTES: ${LOG_MAX_BYTES:-2097152}
      LOG_PATH_HISTORY_LIMIT: ${LOG_PATH_HISTORY_LIMIT:-30}
      LOG_WEB_SOLUTION_LIMIT: ${LOG_WEB_SOLUTION_LIMIT:-5}
      AGENT_LLM_ENABLED: ${AGENT_LLM_ENABLED:-true}
      AGENT_LLM_MODEL: ${AGENT_LLM_MODEL:-gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_CSE_API_KEY: ${GOOGLE_CSE_API_KEY:-}
      GOOGLE_CSE_CX: ${GOOGLE_CSE_CX:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
      AZURE_STORAGE_ACCOUNT: ${AZURE_STORAGE_ACCOUNT:-}
      AZURE_STORAGE_KEY: ${AZURE_STORAGE_KEY:-}
      AZURE_STORAGE_SAS_TOKEN: ${AZURE_STORAGE_SAS_TOKEN:-}
    volumes:
      - ./docker-data/ailoganalyzer:/data
      - ./logs:/logs:ro
      # WebSphere logs from Windows network share
      # Example UI path: /mnt/jgtstaurwcs-server1/SystemOut.log
      - "//jgtstaurwcs/IBM/WebSphere/AppServer/profiles/tstaurora/logs/server1:/mnt/jgtstaurwcs-server1:ro"
    restart: unless-stopped
